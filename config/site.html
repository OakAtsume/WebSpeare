<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <title>{{TITLE}}</title>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; color: #222; background: #fafafa;
           max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.7; }
    h1 { font-size: 1.8rem; font-weight: normal; margin: 0 0 1.5rem; }
    .body { white-space: pre-wrap; }
    a { color: #33484f; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e5e5e5;
             font-size: 0.85rem; color: #999; }
    /* standard screen-reader-only pattern */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
               overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <h1>{{TITLE}}</h1>
  <div class="body">{{POEM}}</div>
  <footer>{{FOOTER}}</footer>
</body>
</html>
